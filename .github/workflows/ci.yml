name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # browsers and their system libraries come in the image; keep in step with @playwright/test in package.json
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:pkg

  browser:
    runs-on: ubuntu-latest
    # the pinned version runs in its image; latest has no matching image, so it installs on the host
    container:
      image: ${{ matrix.image }}
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        include:
          - playwright: "1.64.0"
            image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
          - playwright: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D -E @playwright/test@${{ matrix.playwright }}
      - if: ${{ !matrix.image }}
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright --version
      - run: pnpm test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-results-${{ matrix.playwright }}
          path: test-results

  # The ruleset requires this one context, so matrix values can change without touching it.
  ci:
    needs: [check, browser]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHECK: ${{ needs.check.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          echo "check=$CHECK browser=$BROWSER"
          [[ "$CHECK" == "success" && "$BROWSER" == "success" ]]
