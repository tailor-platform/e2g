name: Check licenses

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/check-licenses.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - ".github/workflows/check-licenses.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: tailor-platform/actions/check-licenses@77effc033b3cb5fa7660b38571fbeb8361d121e8 # v2.8.0
        with:
          license-groups: ${{ vars.CHECK_LICENSES_ALLOWED_LICENSE_GROUPS || 'reciprocal,notice,unencumbered' }}
          additional-licenses: ${{ vars.CHECK_LICENSES_ALLOWED_LICENSES || 'BlueOak-1.0.0,OFL-1.1' }}
          denied-licenses: ${{ vars.CHECK_LICENSES_DENIED_LICENSES }}
